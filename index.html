<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#080511" />
    <meta name="description" content="Musik Mania — game ritme neon yang bisa dimainkan langsung di ponsel dan dipasang sebagai aplikasi." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/icon.svg" />
    <title>Musik Mania - Online Room Lobby Edition</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800;900&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #040209;
        --accent-pink: #ff0055;
        --accent-cyan: #00f0ff;
        --accent-yellow: #ffcc00;
        --accent-green: #00ff66;
        --accent-purple: #8a2be2;
        --glass: rgba(255, 255, 255, 0.04);
        --glass-border: rgba(255, 255, 255, 0.1);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-user-select: none;
        font-family: "Plus Jakarta Sans", sans-serif;
      }
      body {
        background: var(--bg);
        color: #fff;
        overflow: hidden;
        height: 100vh;
        display: flex;
        flex-direction: column;
      }

      /* MENU UTAMA ELEGAN & DYNAMIK */
      #menu,
      #settings-modal,
      #lobby-modal {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        gap: 18px;
        background: radial-gradient(circle at 50% 30%, #1a0836 0%, #05020c 80%);
        position: relative;
        z-index: 100;
        overflow: hidden;
      }

      .bg-particles {
        position: absolute;
        width: 100%;
        height: 100%;
        top: 0;
        left: 0;
        pointer-events: none;
        z-index: 1;
      }

      .brand-title {
        font-size: 4rem;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: -1px;
        text-align: center;
        background: linear-gradient(
          135deg,
          #ffffff 20%,
          var(--accent-cyan) 60%,
          var(--accent-pink) 100%
        );
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 0 25px rgba(0, 240, 255, 0.4));
        animation: titlePulse 2s infinite alternate ease-in-out;
        z-index: 2;
      }

      @keyframes titlePulse {
        0% {
          transform: scale(1);
          filter: drop-shadow(0 0 20px rgba(0, 240, 255, 0.4));
        }
        100% {
          transform: scale(1.03);
          filter: drop-shadow(0 0 40px rgba(255, 0, 85, 0.7));
        }
      }

      .brand-subtitle {
        font-size: 0.9rem;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 8px;
        color: rgba(255, 255, 255, 0.6);
        margin-top: -15px;
        margin-bottom: 20px;
        z-index: 2;
        text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
      }

      .card-container {
        display: flex;
        flex-direction: column;
        gap: 12px;
        width: 100%;
        max-width: 320px;
        z-index: 2;
      }

      .btn-ui {
        width: 100%;
        padding: 16px 24px;
        font-size: 0.95rem;
        font-weight: 800;
        border-radius: 16px;
        border: 1px solid var(--glass-border);
        background: var(--glass);
        color: #fff;
        cursor: pointer;
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        transition: all 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
        text-transform: uppercase;
        letter-spacing: 1px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      }
      .btn-ui:hover {
        background: rgba(255, 255, 255, 0.12);
        border-color: rgba(255, 255, 255, 0.3);
        transform: translateY(-3px) scale(1.02);
        box-shadow: 0 10px 30px rgba(0, 240, 255, 0.3);
      }
      .btn-primary {
        background: linear-gradient(
          135deg,
          var(--accent-pink),
          var(--accent-purple)
        );
        border: none;
        box-shadow: 0 8px 25px rgba(255, 0, 85, 0.4);
      }
      .btn-primary:hover {
        box-shadow: 0 12px 35px rgba(255, 0, 85, 0.7);
      }

      .btn-exit {
        position: absolute;
        top: max(16px, env(safe-area-inset-top));
        right: max(16px, env(safe-area-inset-right));
        z-index: 50;
        padding: 12px 24px;
        border-radius: 30px;
        border: 1px solid rgba(255, 0, 85, 0.5);
        background: rgba(255, 0, 85, 0.2);
        color: #fff;
        font-size: 0.85rem;
        font-weight: 800;
        cursor: pointer;
        backdrop-filter: blur(12px);
        transition: all 0.2s ease;
        letter-spacing: 1px;
        box-shadow: 0 0 15px rgba(255, 0, 85, 0.3);
      }
      .btn-exit:hover {
        background: var(--accent-pink);
        transform: scale(1.08);
        box-shadow: 0 0 25px var(--accent-pink);
      }
      .game-fullscreen {
        position: absolute;
        top: max(16px, env(safe-area-inset-top));
        right: max(106px, calc(env(safe-area-inset-right) + 90px));
        z-index: 50;
        width: 44px;
        height: 44px;
        border: 1px solid rgba(0,240,255,.45);
        border-radius: 50%;
        color: #fff;
        background: rgba(0,240,255,.14);
        font-size: 1.35rem;
        cursor: pointer;
        backdrop-filter: blur(12px);
      }

      .input-ui {
        width: 100%;
        padding: 14px 20px;
        border-radius: 16px;
        border: 1px solid var(--glass-border);
        background: rgba(0, 0, 0, 0.5);
        color: #fff;
        text-align: center;
        font-size: 0.95rem;
        outline: none;
        transition: all 0.2s ease;
        font-weight: 700;
      }
      .input-ui:focus {
        border-color: var(--accent-cyan);
        box-shadow: 0 0 20px rgba(0, 240, 255, 0.4);
      }

      /* LOBI ROOM ONLINE MODAL */
      #lobby-modal {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        display: none;
        z-index: 120;
        background: rgba(4, 2, 9, 0.96);
        backdrop-filter: blur(25px);
      }

      .room-badge {
        font-size: 1.1rem;
        font-weight: 900;
        background: rgba(0, 240, 255, 0.15);
        border: 1px solid var(--accent-cyan);
        padding: 10px 24px;
        border-radius: 30px;
        color: var(--accent-cyan);
        letter-spacing: 2px;
        text-shadow: 0 0 10px var(--accent-cyan);
      }

      .player-card-list {
        display: flex;
        gap: 20px;
        margin: 20px 0;
        width: 100%;
        max-width: 480px;
        justify-content: center;
      }

      .player-card {
        flex: 1;
        padding: 20px;
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid var(--glass-border);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        backdrop-filter: blur(10px);
        transition: all 0.3s ease;
      }

      .player-status-badge {
        font-size: 0.8rem;
        font-weight: 900;
        padding: 6px 14px;
        border-radius: 12px;
        letter-spacing: 1px;
      }
      .status-not-ready {
        background: rgba(255, 0, 85, 0.2);
        color: var(--accent-pink);
        border: 1px solid var(--accent-pink);
      }
      .status-ready {
        background: rgba(0, 255, 102, 0.2);
        color: var(--accent-green);
        border: 1px solid var(--accent-green);
        box-shadow: 0 0 15px rgba(0, 255, 102, 0.4);
      }

      #settings-modal {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        display: none;
        background: rgba(4, 2, 9, 0.95);
        backdrop-filter: blur(20px);
      }
      .setting-row {
        display: flex;
        justify-content: space-between;
        width: 300px;
        align-items: center;
        font-weight: 700;
      }

      #game-container {
        display: none;
        flex: 1;
        width: 100%;
        height: 100%;
        position: relative;
        background: #000;
        overflow: hidden;
      }

      /* BACKGROUND PANGGUNG DENGAN EFEK PETIR & LIGHTING */
      .stage-background {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: radial-gradient(circle at 50% 20%, #1e093d 0%, #030108 85%);
        pointer-events: none;
        z-index: 1;
        transition: background 0.1s;
      }

      .stage-flash {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: radial-gradient(
          circle at 50% 50%,
          rgba(0, 240, 255, 0.15),
          transparent 70%
        );
        opacity: 0;
        pointer-events: none;
        z-index: 2;
        transition: opacity 0.08s ease-out;
      }

      /* EQUALIZER AUDIO DRAMATIS DI PANGGUNG */
      .equalizer-bar-container {
        position: absolute;
        bottom: 15%;
        width: 100%;
        display: flex;
        justify-content: space-between;
        padding: 0 5%;
        height: 120px;
        opacity: 0.25;
        z-index: 1;
        pointer-events: none;
      }
      .eq-bar {
        width: 12px;
        background: linear-gradient(
          to top,
          var(--accent-purple),
          var(--accent-cyan)
        );
        border-radius: 10px;
        height: 20%;
        transition: height 0.08s ease;
      }

      .spotlight {
        position: absolute;
        top: -20%;
        width: 320px;
        height: 140%;
        background: linear-gradient(
          180deg,
          rgba(0, 240, 255, 0.25) 0%,
          rgba(0, 0, 0, 0) 100%
        );
        clip-path: polygon(45% 0%, 55% 0%, 100% 100%, 0% 100%);
        animation: swing 3.5s ease-in-out infinite alternate;
        transform-origin: top center;
      }
      .spotlight-2 {
        right: 10%;
        background: linear-gradient(
          180deg,
          rgba(255, 0, 85, 0.25) 0%,
          rgba(0, 0, 0, 0) 100%
        );
        animation-delay: -1.75s;
      }

      @keyframes swing {
        0% {
          transform: rotate(-18deg);
        }
        100% {
          transform: rotate(18deg);
        }
      }

      /* BAND SVG ANIMASI ROCKER KAYA EFEK */
      .band-svg {
        position: absolute;
        bottom: 20%;
        left: 50%;
        transform: translateX(-50%);
        width: 300px;
        height: 160px;
        z-index: 2;
        opacity: 0.9;
        filter: drop-shadow(0 0 20px rgba(138, 43, 226, 0.6));
      }
      .vocalist-anim {
        animation: rockSync 0.4s ease-in-out infinite alternate;
        transform-origin: bottom center;
      }
      .guitarist-anim {
        animation: rockSync 0.32s ease-in-out infinite alternate-reverse;
        transform-origin: bottom center;
      }
      .drummer-anim {
        animation: drumBeat 0.2s ease-in-out infinite alternate;
        transform-origin: center;
      }

      @keyframes rockSync {
        0% {
          transform: translateY(0) rotate(-1deg);
        }
        100% {
          transform: translateY(-10px) rotate(2deg);
        }
      }
      @keyframes drumBeat {
        0% {
          transform: scale(1);
        }
        100% {
          transform: scale(1.05);
        }
      }

      /* TRACK & HIGHWAY (3D PERSPEKTIF PRESISI) */
      .track-container {
        flex: 1;
        height: 100%;
        position: relative;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-end;
        z-index: 10;
      }

      .highway {
        width: 100%;
        max-width: 440px;
        height: 100%;
        position: relative;
        perspective: none;
      }
      .board {
        position: absolute;
        width: 100%;
        height: 100%;
        transform: none;
        transform-origin: bottom center;
        background: linear-gradient(
          to bottom,
          rgba(15, 5, 30, 0.2) 0%,
          rgba(25, 10, 45, 0.9) 100%
        );
        border-left: 3px solid rgba(0, 240, 255, 0.6);
        border-right: 3px solid rgba(255, 0, 85, 0.6);
        box-shadow: 0 0 35px rgba(0, 240, 255, 0.25);
      }

      .lane-line {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 1px;
        background: rgba(255, 255, 255, 0.1);
      }
      .line-0 {
        left: 25%;
      }
      .line-1 {
        left: 50%;
      }
      .line-2 {
        left: 75%;
      }

      .target-bar {
        position: absolute;
        bottom: 80px;
        width: 100%;
        height: 70px;
        display: flex;
        justify-content: space-around;
        padding: 0 10px;
        z-index: 10;
      }
      .fret-target {
        width: 58px;
        height: 58px;
        border-radius: 50%;
        border: 3px solid rgba(255, 255, 255, 0.9);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.1rem;
        font-weight: 900;
        color: #fff;
        backdrop-filter: blur(6px);
        transition: transform 0.05s ease-out;
      }
      .fret-0 {
        border-color: var(--accent-green);
        box-shadow:
          0 0 18px rgba(0, 255, 102, 0.5),
          inset 0 0 10px rgba(0, 255, 102, 0.3);
      }
      .fret-1 {
        border-color: var(--accent-pink);
        box-shadow:
          0 0 18px rgba(255, 0, 85, 0.5),
          inset 0 0 10px rgba(255, 0, 85, 0.3);
      }
      .fret-2 {
        border-color: var(--accent-yellow);
        box-shadow:
          0 0 18px rgba(255, 204, 0, 0.5),
          inset 0 0 10px rgba(255, 204, 0, 0.3);
      }
      .fret-3 {
        border-color: var(--accent-cyan);
        box-shadow:
          0 0 18px rgba(0, 240, 255, 0.5),
          inset 0 0 10px rgba(0, 240, 255, 0.3);
      }
      .fret-target.active {
        transform: scale(0.85);
        filter: brightness(1.8);
      }

      /* EFEK LEDAKAN PARTIKEL SAAT HIT */
      .spark {
        position: absolute;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        pointer-events: none;
        z-index: 15;
        animation: sparkFly 0.35s ease-out forwards;
      }
      @keyframes sparkFly {
        0% {
          opacity: 1;
          transform: translate(0, 0) scale(1);
        }
        100% {
          opacity: 0;
          transform: translate(var(--dx), var(--dy)) scale(0.2);
        }
      }

      /* NOTES DENGAN EFEK GLOW MEMUKAU */
      .note {
        position: absolute;
        width: 48px;
        height: 48px;
        border-radius: 50%;
        top: -50px;
        transform: translateX(-50%);
        border: 3px solid #fff;
        z-index: 5;
        will-change: transform, top;
        animation: noteGlow 0.5s infinite alternate;
      }
      .song-load-status { display: none; gap: 7px; color: rgba(255,255,255,.76); font-size: .74rem; }
      .song-load-status.visible { display: grid; }
      .song-load-track { height: 7px; overflow: hidden; border-radius: 99px; background: rgba(255,255,255,.14); }
      .song-load-fill { width: 0; height: 100%; border-radius: inherit; background: linear-gradient(90deg,var(--accent-cyan),var(--accent-pink)); transition: width .18s ease; }
      .song-load-status[data-state="loading"] .song-load-fill { animation: songLoadPulse 1.2s ease-in-out infinite alternate; }
      .song-load-status[data-state="ready"] { color: var(--accent-green); }
      .song-load-status[data-state="error"] { color: var(--accent-pink); }
      @keyframes songLoadPulse { from { filter: brightness(.8); } to { filter: brightness(1.5); } }
      .btn-ui:disabled { opacity: .45; cursor: wait; transform: none; box-shadow: none; }
      .board { overflow: visible; }
      .note { z-index: 12; }

      @keyframes noteGlow {
        0% {
          filter: brightness(1);
        }
        100% {
          filter: brightness(1.4);
        }
      }

      .note-tail {
        position: absolute;
        width: 14px;
        transform: translateX(-50%);
        top: 0;
        left: 50%;
        z-index: -1;
        border-radius: 6px;
        opacity: 0.85;
      }

      .note[data-key="0"],
      .note-tail[data-key="0"] {
        background: radial-gradient(circle, var(--accent-green) 30%, #000 100%);
        color: var(--accent-green);
        box-shadow: 0 0 20px var(--accent-green);
      }
      .note[data-key="1"],
      .note-tail[data-key="1"] {
        background: radial-gradient(circle, var(--accent-pink) 30%, #000 100%);
        color: var(--accent-pink);
        box-shadow: 0 0 20px var(--accent-pink);
      }
      .note[data-key="2"],
      .note-tail[data-key="2"] {
        background: radial-gradient(
          circle,
          var(--accent-yellow) 30%,
          #000 100%
        );
        color: var(--accent-yellow);
        box-shadow: 0 0 20px var(--accent-yellow);
      }
      .note[data-key="3"],
      .note-tail[data-key="3"] {
        background: radial-gradient(circle, var(--accent-cyan) 30%, #000 100%);
        color: var(--accent-cyan);
        box-shadow: 0 0 20px var(--accent-cyan);
      }

      .hud {
        position: absolute;
        top: max(16px, env(safe-area-inset-top));
        left: max(16px, env(safe-area-inset-left));
        right: 116px;
        width: auto;
        max-width: calc(100% - 148px);
        display: flex;
        gap: 15px;
        font-size: 0.85rem;
        z-index: 20;
        font-weight: 800;
        background: rgba(0, 0, 0, 0.5);
        padding: 10px 20px;
        border-radius: 20px;
        backdrop-filter: blur(12px);
        border: 1px solid var(--glass-border);
      }
      .band-svg .person-shadow { fill: rgba(2, 1, 8, .9); }
      .band-svg .person-highlight { fill: rgba(255, 255, 255, .14); }
      .band-svg .limb { fill: none; stroke-linecap: round; stroke-linejoin: round; }

      .song-progress {
        position: absolute; z-index: 30; top: max(72px, calc(env(safe-area-inset-top) + 56px));
        left: 50%; transform: translateX(-50%); width: min(440px, calc(100% - 32px));
        display: flex; align-items: center; gap: 10px; padding: 8px 12px;
        border: 1px solid rgba(255,255,255,.12); border-radius: 16px;
        background: rgba(5,3,12,.58); backdrop-filter: blur(12px);
      }
      .song-progress time { min-width: 36px; color: rgba(255,255,255,.72); font-size: .68rem; font-weight: 800; font-variant-numeric: tabular-nums; }
      .song-progress time:last-child { text-align: right; }
      .song-progress-track { height: 6px; flex: 1; overflow: hidden; border-radius: 99px; background: rgba(255,255,255,.14); }
      .song-progress-fill { width: 0; height: 100%; border-radius: inherit; background: linear-gradient(90deg,var(--accent-cyan),var(--accent-pink)); box-shadow: 0 0 14px rgba(0,240,255,.55); transition: width .12s linear; }
      .song-progress-fill { will-change: width; }
      .game-audio-controls { position:absolute; z-index:35; top:max(108px,calc(env(safe-area-inset-top) + 94px)); left:50%; transform:translateX(-50%); display:flex; align-items:center; gap:9px; padding:7px 10px; border:1px solid rgba(255,255,255,.12); border-radius:14px; background:rgba(5,3,12,.68); backdrop-filter:blur(12px); }
      .game-audio-controls button { min-width:38px; min-height:32px; padding:5px 9px; border:1px solid rgba(255,255,255,.16); border-radius:10px; color:#fff; background:rgba(255,255,255,.08); font-size:.7rem; font-weight:900; }
      .game-audio-controls input { width:90px; accent-color:var(--accent-cyan); }
      #game-container.is-paused .track-container { filter:brightness(.55); }
      #game-container.is-paused::after { content:"DIJEDA"; position:absolute; z-index:34; top:50%; left:50%; transform:translate(-50%,-50%); padding:12px 22px; border:1px solid rgba(0,240,255,.45); border-radius:16px; background:rgba(4,2,9,.72); color:var(--accent-cyan); font-size:1.5rem; font-weight:900; letter-spacing:.12em; pointer-events:none; }
      .track-container, .highway, .board { contain: layout paint; }
      .note { backface-visibility: hidden; transform: translate3d(-50%,0,0); }
      .online-rival { display: block; margin-top: 4px; color: rgba(255,255,255,.7); font-size: .72em; white-space: nowrap; }
      .online-rival strong { color: #fff; }
      .combo-best { color: var(--accent-yellow); }
      #hit-offset { accent-color: var(--accent-cyan); }

      #result-modal {
        display: none; position: fixed; inset: 0; z-index: 150; flex-direction: column;
        align-items: center; justify-content: center; gap: 14px; padding: 24px;
        background: rgba(4,2,9,.82); backdrop-filter: blur(20px);
      }
      .result-card { width: min(100%, 420px); padding: 30px; text-align: center; border: 1px solid var(--glass-border); border-radius: 28px; background: linear-gradient(145deg,rgba(30,15,54,.96),rgba(8,5,18,.96)); box-shadow: 0 28px 100px rgba(0,0,0,.55); }
      .result-card h2 { margin-bottom: 8px; font-size: 2rem; font-weight: 900; }
      .result-score { margin: 18px 0 24px; color: var(--accent-cyan); font-size: 2.6rem; font-weight: 900; text-shadow: 0 0 24px rgba(0,240,255,.4); }
      .result-card .btn-ui { margin-top: 9px; }
      .ping-badge {
        color: var(--accent-cyan);
        white-space: nowrap;
      }

      /* RESPONSIVE, MOTION-SAFE, TOUCH-FIRST POLISH */
      :root { color-scheme: dark; }
      html { min-height: 100%; background: var(--bg); }
      body { min-height: 100svh; height: 100svh; }
      button, select, input { font: inherit; }
      button { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
      .btn-ui, .btn-exit, .fret-target, .player-card, .input-ui {

    <script>
      /* ==========================================
       PARTIKEL BACKGROUND MENU UTAMA

      const canvas = document.getElementById("menu-canvas");
      const ctx = canvas.getContext("2d");
      let particles = [];

      function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      window.addEventListener("resize", resizeCanvas);
      resizeCanvas();

      for (let i = 0; i < 40; i++) {
        particles.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          radius: Math.random() * 3 + 1,
          color: ["#00f0ff", "#ff0055", "#7900ff"][
            Math.floor(Math.random() * 3)
          ],
          speedY: Math.random() * 1.5 + 0.5,
          speedX: Math.random() * 1 - 0.5,
        });
      }

      function animateMenuBg() {
        if (document.hidden) {
          requestAnimationFrame(animateMenuBg);
          return;
        }
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach((p) => {
          p.y -= p.speedY;
          p.x += p.speedX;
          if (p.y < 0) p.y = canvas.height;
          if (p.x < 0 || p.x > canvas.width) p.speedX *= -1;

          ctx.beginPath();
          ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
          ctx.fillStyle = p.color;
          ctx.shadowBlur = 10;
          ctx.shadowColor = p.color;
          ctx.fill();
        });
        requestAnimationFrame(animateMenuBg);
      }
      animateMenuBg();

      /* ==========================================
       AUDIO ENGINE & CHIP TUNE SONGS GENERATOR
       ========================================== */
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const laneFreqs = [261.63, 329.63, 392.0, 523.25];

      const songs = [

        ],
        [
          329.63, 329.63, 392.0, 440.0, 392.0, 329.63, 293.66, 329.63, 392.0,
          523.25, 440.0, 392.0,
        ],
        [
          523.25, 587.33, 659.25, 523.25, 659.25, 783.99, 659.25, 523.25, 440.0,
          523.25, 659.25, 783.99,
        ],
        Array.from({ length: 120 }, (_, beat) => {
          const phrase = [261.63, 329.63, 392.0, 523.25, 392.0, 329.63, 261.63, 392.0,
            293.66, 349.23, 440.0, 587.33, 440.0, 349.23, 293.66, 440.0];
          const phraseBeat = beat % phrase.length;
          return beat % 32 >= 24 && phraseBeat % 4 === 3 ? 659.25 : phrase[phraseBeat];
        }),
      ];

      function playSound(freq, duration = 0.2, type = "sawtooth", volume = songVolume) {
        if (audioCtx.state === "suspended") audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(volume, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(
          0.001,
          audioCtx.currentTime + duration,
        );
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      }

      function startSongMusic() {
        const songIdx = parseInt(document.getElementById("song-select").value, 10) || 0;
        const songNotes = songs[songIdx];
        songNoteStep = 0;
        const diff = document.getElementById("difficulty").value;
        const isCustomSong = Boolean(customSongAudio && customSongUrl && customSongSelected);
        const isMarathonSong = !isCustomSong && songIdx === 3;
        beatIntervalMs = isMarathonSong ? 500 : diff === "easy" ? 750 : diff === "medium" ? 500 : 280;
        resumeSongPlayback = null;
        roundSongName = isCustomSong ? customSongAudio.name : document.getElementById("song-select").selectedOptions[0].textContent;
        const notesForSong = isCustomSong ? null : songNotes;
        const noteCount = notesForSong ? notesForSong.length : 0;
        songDurationMs = isCustomSong ? Infinity : noteCount * beatIntervalMs;
        songStartedAt = performance.now();
        roundFinished = false;
        roundNotesSpawned = 0;
        roundNotesHit = 0;
        roundNotesPerfect = 0;
        playerAccuracyStats = players.map(() => ({ spawned: 0, hit: 0, perfect: 0 }));
        updateSongProgress(0);
        document.getElementById("song-duration").textContent = isCustomSong && Number.isFinite(customSongAudio.duration)
          ? formatSongTime(customSongAudio.duration * 1000)
          : formatSongTime(songDurationMs);

        stopSongMusic();
        if (isCustomSong) {
          customSongAudio.pause();
          customSongAudio.currentTime = 0;
        }
        if (isCustomSong) {
          customSongAudio.play().catch(() => showFeedback(0, "TEKAN UNTUK MULAI AUDIO", "var(--accent-yellow)"));
          customSongAudio.onended = finishGame;
          songProgressTimer = setInterval(() => {
            if (!customSongAudio || !Number.isFinite(customSongAudio.duration)) return;
            songDurationMs = customSongAudio.duration * 1000;
            updateSongProgress(customSongAudio.currentTime * 1000);
            if (customSongAudio.ended) finishGame();
          }, 80);
          return;
        }
        // Start the first note immediately and keep each note aligned with the selected pace.
        const playNextSongNote = () => {
          if (gamePaused || roundFinished) return;
          if (songNoteStep >= noteCount) {
            const remaining = Math.max(0, songStartedAt + songDurationMs - performance.now());
            songFinishTimer = setTimeout(finishGame, remaining);
            return;
          }
          const dueAt = songStartedAt + songNoteStep * beatIntervalMs;
          songNoteTimer = setTimeout(() => {
            if (gamePaused || roundFinished) return;
            playSound(notesForSong[songNoteStep], Math.min(.25, beatIntervalMs / 1000), "triangle");
            animateStageEq();
            songNoteStep++;
            playNextSongNote();
          }, Math.max(0, dueAt - performance.now()));
        };
        resumeSongPlayback = playNextSongNote;
        playNextSongNote();
        songProgressTimer = setInterval(() => {
          const elapsed = Math.min(performance.now() - songStartedAt, songDurationMs);
          updateSongProgress(elapsed);
        }, 80);
      }

      function stopSongMusic() {
        if (songNoteTimer) clearTimeout(songNoteTimer);
        if (songProgressTimer) clearInterval(songProgressTimer);
        if (songFinishTimer) clearTimeout(songFinishTimer);
        songNoteTimer = null;
        songProgressTimer = null;
        songFinishTimer = null;
      }

      function formatSongTime(milliseconds) {
        const seconds = Math.floor(milliseconds / 1000);
        return `${Math.floor(seconds / 60)}:${String(seconds % 60).padStart(2, "0")}`;
      }

      function updateSongProgress(elapsed) {
        const duration = customSongAudio && Number.isFinite(customSongAudio.duration)
          ? customSongAudio.duration * 1000 : songDurationMs;
        const progress = duration && Number.isFinite(duration) ? Math.min(100, (elapsed / duration) * 100) : 0;
        document.getElementById("song-progress-fill").style.width = `${progress}%`;
        document.getElementById("song-elapsed").textContent = formatSongTime(elapsed);
      }

      function setCustomSongLoad(state, message, progress) {
        const status = document.getElementById("custom-song-load");
        const fill = document.getElementById("custom-song-load-fill");
        const bar = status.querySelector('[role="progressbar"]');
        status.classList.add("visible");
        status.dataset.state = state;
        document.getElementById("custom-song-load-message").textContent = message;
        fill.style.width = `${progress}%`;
        bar.setAttribute("aria-valuenow", String(progress));
      }

      function updateCustomSongBuffer(audio, token) {
        if (token !== customSongLoadToken || customSongReady) return;
        let progress = 12;
        if (Number.isFinite(audio.duration) && audio.duration > 0 && audio.buffered.length) {
          progress = Math.min(90, Math.max(12, Math.round(audio.buffered.end(audio.buffered.length - 1) / audio.duration * 90)));
        } else if (audio.readyState >= HTMLMediaElement.HAVE_METADATA) {
          progress = 30;
        }
        setCustomSongLoad("loading", audio.readyState >= HTMLMediaElement.HAVE_METADATA ? "Memuat data audio..." : "Membaca file audio...", progress);
      }

      function loadCustomSong(file) {
        if (!file) return;
        const token = ++customSongLoadToken;
        customSongReady = false;
        customSongSelected = true;
        document.querySelectorAll(".game-start-button").forEach((button) => { button.disabled = true; });
        if (customSongAudio) customSongAudio.pause();
        if (customSongUrl) URL.revokeObjectURL(customSongUrl);
        customSongUrl = URL.createObjectURL(file);
        const audio = new Audio();
        customSongAudio = audio;
        audio.preload = "auto";
        audio.volume = songVolume;
        audio.src = customSongUrl;
        document.getElementById("custom-song-name").textContent = `Lagu dipilih: ${file.name}`;
        document.getElementById("custom-song-name").style.display = "block";
        document.getElementById("song-select").value = "custom";
        const customOption = document.querySelector('#song-select option[value="custom"]');
        if (!customOption) document.getElementById("song-select").insertAdjacentHTML("beforeend", '<option value="custom">♫ Lagu sendiri</option>');
        setCustomSongLoad("loading", "Membaca file audio...", 5);

        const markReady = () => {
          if (token !== customSongLoadToken) return;
          customSongReady = true;
          setCustomSongLoad("ready", `Siap dimainkan · ${file.name}`, 100);
          document.querySelectorAll(".game-start-button").forEach((button) => { button.disabled = false; });
        };
        const markError = () => {
          if (token !== customSongLoadToken) return;
          customSongReady = false;
          customSongSelected = false;
          document.getElementById("song-select").value = "0";
          setCustomSongLoad("error", "File gagal dibaca. Pilih audio lain.", 0);
          document.querySelectorAll(".game-start-button").forEach((button) => { button.disabled = false; });
        };
        audio.addEventListener("loadedmetadata", () => updateCustomSongBuffer(audio, token));
        audio.addEventListener("progress", () => updateCustomSongBuffer(audio, token));
        audio.addEventListener("canplay", markReady, { once: true });
        audio.addEventListener("error", markError, { once: true });
        audio.load();
      }

      function selectBuiltInSong() {
        if (document.getElementById("song-select").value !== "custom") {
          customSongSelected = false;
          document.querySelectorAll(".game-start-button").forEach((button) => { button.disabled = false; });
        }
      }

      function accuracyPercent(stats = playerAccuracyStats[0]) {
        return stats?.spawned ? Math.round((stats.perfect / stats.spawned) * 100) : 0;
      }

      async function submitLeaderboard(scores) {
        const board = document.getElementById("leaderboard");
        if (!window.db || !window.firestoreCollection) {
          board.innerHTML = "<strong>LEADERBOARD ONLINE</strong><br><span style='color:#ffcc00'>Tidak tersedia — Firebase belum tersambung.</span>";
          return;
        }
        let playerName = localStorage.getItem("musikManiaPlayerName");
        if (!playerName) {
          try { playerName = prompt("Nama untuk leaderboard:"); } catch (_) { playerName = "Pemain"; }
        }
        playerName = (playerName || "Pemain").trim().slice(0, 20) || "Pemain";
        localStorage.setItem("musikManiaPlayerName", playerName);
        const songName = roundSongName.slice(0, 80);
        try {
          for (let index = 0; index < scores.length; index++) {
            await window.firestoreAddDoc(window.firestoreCollection(window.db, "leaderboard"), {
              name: scores.length > 1 ? `${playerName} (P${index + 1})` : playerName,
              score: Number(scores[index]) || 0,
              accuracy: accuracyPercent(playerAccuracyStats[index]),
              song: songName,
              createdAt: Date.now(),
            });
          }
          const scoresQuery = window.firestoreQuery(
            window.firestoreCollection(window.db, "leaderboard"),
            window.firestoreOrderBy("score", "desc"),
            window.firestoreLimit(10),
          );
          const snapshot = await window.firestoreGetDocs(scoresQuery);
          const rows = snapshot.docs.map((item) => item.data()).filter((row) => row.song === songName);
          board.innerHTML = `<strong>LEADERBOARD ONLINE · ${escapeHtml(songName)}</strong><ol style="padding:8px 0 0 22px">${rows.map((row) => `<li>${escapeHtml(row.name || "Pemain")} — ${Number(row.score) || 0} <span style="color:var(--accent-cyan)">(${Number(row.accuracy) || 0}%)</span></li>`).join("") || "<li>Belum ada skor untuk lagu ini</li>"}</ol>`;
        } catch (error) {
          console.error("Leaderboard gagal dimuat. Periksa Firestore rules.", error);
          board.innerHTML = "<strong>LEADERBOARD ONLINE</strong><br><span style='color:#ffcc00'>Skor gagal dikirim. Periksa koneksi dan Firestore Security Rules.</span>";
        }
      }

      function escapeHtml(value) {
        return String(value).replace(/[&<>"']/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[char]);
      }

      function finishGame() {
        if (roundFinished || !players.length) return;
        roundFinished = true;
        gamePaused = false;
        stopSongMusic();
        clearInterval(songIntervalId);
        cancelAnimationFrame(gameLoopId);
        const resultModal = document.getElementById("result-modal");
        const score = players.map((player) => player.score);
        document.getElementById("final-score").textContent = score.join("  •  ");
        const accuracyLabel = playerAccuracyStats.map((stats, index) => `P${index + 1} ${accuracyPercent(stats)}% (${stats.hit}/${stats.spawned})`).join(" · ");
        document.getElementById("final-accuracy").textContent = `AKURASI TEPAT · ${accuracyLabel}`;
        document.getElementById("result-title").textContent = score.length > 1 && score[0] !== score[1]
          ? `PLAYER ${score[0] > score[1] ? "1" : "2"} MENANG!`
          : "LAGU SELESAI!";
        resultModal.style.display = "flex";
        if (customSongAudio) customSongAudio.pause();
        submitLeaderboard(score);
      }

      /* ==========================================
       ANIMASI EQUALIZER & LIGHTING PANGGUNG
       ========================================== */
      const eqContainer = document.getElementById("eq-container");
      for (let i = 0; i < 24; i++) {
        const bar = document.createElement("div");
        bar.className = "eq-bar";
        eqContainer.appendChild(bar);

      function triggerSparkEffect(x, y, color) {
        for (let i = 0; i < 12; i++) {
          const spark = document.createElement("div");
          spark.className = "spark";
          spark.style.backgroundColor = color;
          spark.style.boxShadow = `0 0 10px ${color}`;

          document.getElementById("game-container").appendChild(spark);
          setTimeout(() => spark.remove(), 350);

      /* ==========================================
       MANAJEMEN ROOM & STATUS READY (ONLINE LOBBY)
       ========================================== */
      let isOnline = false,
        roomId = null,
        playerRole = 0;
      let myReadyStatus = false;
      let unsubscribeRoom = null;

      function generateRoomCode() {
        const code = Math.floor(1000 + Math.random() * 9000).toString();
        document.getElementById("room-id").value = code;
      }

      async function joinOnlineRoom() {
        if (customSongSelected && !customSongReady) return alert("Tunggu sampai lagu sendiri selesai dimuat.");
        const roomInput = document.getElementById("room-id").value.trim();
        if (!roomInput)
          return alert("Masukkan atau buat Kode Room terlebih dahulu!");
        if (!window.db) return alert("Firestore belum siap!");

        isOnline = true;
        roomId = roomInput;
        document.getElementById("display-room-id").innerText = roomId;

        const roomRef = window.doc(window.db, "rooms", roomId);
        const docSnap = await window.getDoc(roomRef);

        if (!docSnap.exists()) {
          playerRole = 0; // P1 (Host)
          await window.setDoc(roomRef, {
            p1_ready: false,
            p2_ready: false,
            p1_score: 0,
            p2_score: 0,
            gameStarted: false,
          });
        } else {
          playerRole = 1; // P2 (Guest)
        }

        roomRefCurrent = roomRef;
        myOnlineName = (localStorage.getItem("musikManiaPlayerName") || prompt("Nama pemain:") || `Pemain ${playerRole + 1}`).trim().slice(0, 20);
        localStorage.setItem("musikManiaPlayerName", myOnlineName);
        const myRoomPrefix = `p${playerRole + 1}`;
        await window.updateDoc(roomRef, { [`${myRoomPrefix}_name`]: myOnlineName });
        if (roomPingTimer) clearInterval(roomPingTimer);
        const updateRoomPing = async () => {
          const startedAt = performance.now();
          try {
            await window.getDoc(roomRef);
            const roundTripMs = Math.max(1, Math.round(performance.now() - startedAt));
            await window.updateDoc(roomRef, { [`${myRoomPrefix}_ping`]: roundTripMs });
          } catch (error) {
            console.warn("Ping room tidak tersedia", error);
          }
        };
        updateRoomPing();
        roomPingTimer = setInterval(updateRoomPing, 8000);

        myReadyStatus = false;
        updateReadyButtonUI();

        document.getElementById("lobby-modal").style.display = "flex";

        // Realtime listener untuk status Lobi & Persiapan Player
        unsubscribeRoom = window.onSnapshot(roomRef, (snapshot) => {
          const data = snapshot.data();
          if (!data) return;

          // Update UI P1
          const statusP1El = document.getElementById("status-p1");
          if (data.p1_ready) {
            statusP1El.innerText = "SIAP!";
            statusP1El.className = "player-status-badge status-ready";
          } else {
            statusP1El.innerText = "BELUM SIAP";
            statusP1El.className = "player-status-badge status-not-ready";
          }

          // Update UI P2
          const statusP2El = document.getElementById("status-p2");
          if (data.p2_ready) {
            statusP2El.innerText = "SIAP!";
            statusP2El.className = "player-status-badge status-ready";
          } else {
            statusP2El.innerText = "BELUM SIAP";
            statusP2El.className = "player-status-badge status-not-ready";
          }

          // Skor Online Sync saat Pertandingan Berlangsung
          if (
            document.getElementById("game-container").style.display === "flex"
          ) {
            const oppRole = playerRole === 0 ? 1 : 0;
            const oppScoreEl = document.getElementById(`score-${oppRole}`);
            if (oppScoreEl)
              oppScoreEl.innerText = data[`p${oppRole + 1}_score`] || 0;
            const mobileOppScore = document.getElementById("online-opponent-score");
            if (mobileOppScore) mobileOppScore.textContent = data[`p${oppRole + 1}_score`] || 0;
            const mobileOppName = document.getElementById("online-opponent-name");
            if (mobileOppName) mobileOppName.textContent = data[`p${oppRole + 1}_name`] || `Pemain ${oppRole + 1}`;
            const mobileOppPing = document.getElementById("online-opponent-ping");
            if (mobileOppPing) mobileOppPing.textContent = data[`p${oppRole + 1}_ping`] ?? "—";
          }

          // OTOMATIS MULAI GAME JIKA KEDUA PLAYER SIAP
          if (data.p1_ready && data.p2_ready && !data.gameStarted) {
            if (playerRole === 0) {
              window.updateDoc(roomRef, { gameStarted: true });
            }
            document.getElementById("lobby-modal").style.display = "none";
            initEngine(isMobileLayout() ? 1 : 2);
          }
        });
      }

      async function toggleReadyStatus() {
        myReadyStatus = !myReadyStatus;
        updateReadyButtonUI();

        const roomRef = window.doc(window.db, "rooms", roomId);
        const updateData = {};
        updateData[`p${playerRole + 1}_ready`] = myReadyStatus;
        await window.updateDoc(roomRef, updateData);
      }

      function updateReadyButtonUI() {
        const btn = document.getElementById("btn-ready");
        if (myReadyStatus) {
          btn.innerText = "BATALKAN SIAP";
          btn.style.background = "rgba(255, 0, 85, 0.4)";
        } else {
          btn.innerText = "SAYA SIAP!";
          btn.style.background =
            "linear-gradient(135deg, var(--accent-pink), var(--accent-purple))";
        }
      }

      function leaveLobby() {
        if (unsubscribeRoom) unsubscribeRoom();
        if (roomPingTimer) clearInterval(roomPingTimer);
        roomPingTimer = null;
        document.getElementById("lobby-modal").style.display = "none";
        isOnline = false;
      }

      /* ==========================================
       GAME ENGINE & STATE MANAGEMENT
       ========================================== */
      let gameLoopId, songIntervalId;
      let players = [];
      let noteSpeed = 9;
      let activeHolds = {};
      let lastFrameTime = performance.now();

      const keyMappings = [
        {
          keys: ["ArrowLeft", "ArrowUp", "ArrowDown", "ArrowRight"],
          labels: ["←", "↑", "↓", "→"],
        },
        { keys: ["a", "w", "s", "d"], labels: ["A", "W", "S", "D"] },
      ];
      const laneXPositions = [12.5, 37.5, 62.5, 87.5];

      function showFeedback(pIdx, text, color) {
        const fb = document.getElementById(`feedback-${pIdx}`);
        if (!fb) return;
        fb.innerText = text;
        fb.style.color = color;
        fb.classList.add("show");
        setTimeout(() => fb.classList.remove("show"), 160);
      }

      function toggleSettings(show) {
        document.getElementById("settings-modal").style.display = show
          ? "flex"
          : "none";
        if (!show) {
          noteSpeed = parseInt(document.getElementById("speed-setting").value);
          songVolume = parseFloat(
            document.getElementById("volume-setting").value,
          );
          hitOffsetMs = Number(document.getElementById("hit-offset").value) || 0;
          document.getElementById("hit-offset-value").textContent = `${hitOffsetMs} ms`;
        }
      }

      function isMobileLayout() {
        return window.matchMedia("(max-width: 700px), (pointer: coarse)").matches;
      }

      function createTrackHTML(pIdx, label) {
        const onlineMobile = isOnline && isMobileLayout();
        const storedRecord = Number(localStorage.getItem("musikManiaBestScore") || 0);
        return `
        <div class="track-container" id="track-${pIdx}">
          <div class="hud">
            <div>${label} &nbsp;|&nbsp; SKOR: <span id="score-${pIdx}">0</span> &nbsp;|&nbsp; COMBO: <span id="combo-${pIdx}">0</span> <span class="combo-best">BEST ${bestCombo}</span>${onlineMobile ? `<span class="online-rival">LAWAN: <strong id="online-opponent-name">Menunggu...</strong> · <span id="online-opponent-score">0</span> poin · <span id="online-opponent-ping">—</span> ms</span>` : ""}${!isOnline ? `<span class="online-rival">REKOR PRIBADI: <strong>${storedRecord}</strong></span>` : ""}</div>
            <div class="ping-badge"><span id="ping-${pIdx}">18</span>ms</div>
          </div>
          <div class="feedback" id="feedback-${pIdx}">PERFECT!</div>
          <div class="highway">
            <div class="board" id="board-${pIdx}">
              <div class="lane-line line-0"></div>
              <div class="lane-line line-1"></div>
              <div class="lane-line line-2"></div>
            </div>
            <div class="target-bar">
              ${[0, 1, 2, 3]
                .map(
                  (i) => `
                <div class="fret-target fret-${i}" id="fret-${pIdx}-${i}">
                  ${keyMappings[pIdx % 2].labels[i]}
                </div>
              `,
                )
                .join("")}
            </div>
          </div>
        </div>
      `;
      }

      function startGame(playerCount) {
        if (customSongSelected && !customSongReady) return alert("Tunggu sampai lagu sendiri selesai dimuat.");
        isOnline = false;
        selectedPlayerCount = playerCount;
        initEngine(playerCount);
      }

      function restartGame() {
        document.getElementById("result-modal").style.display = "none";
        initEngine(selectedPlayerCount);
      }

      function initEngine(playerCount) {
        selectedPlayerCount = playerCount;
        roundFinished = false;
        gamePaused = false;
        clearInterval(songIntervalId);
        stopSongMusic();
        if (customSongAudio) customSongAudio.pause();
        document.getElementById("result-modal").style.display = "none";
        document.getElementById("menu").style.display = "none";
        const container = document.getElementById("game-container");
        container.style.display = "flex";
        container.classList.remove("is-paused");
        document.getElementById("game-pause").textContent = "JEDA";
        document.getElementById("game-volume").value = String(songVolume);

        const existingTracks = container.querySelectorAll(".track-container");
        existingTracks.forEach((t) => t.remove());

        const onlineMobile = isOnline && isMobileLayout();
        const trackCount = onlineMobile ? 1 : playerCount;
        players = [];
        for (let i = 0; i < trackCount; i++) {
          const playerLabel = isOnline && onlineMobile ? `P${playerRole + 1} (KAMU)` : `P${i + 1}`;
          container.insertAdjacentHTML("beforeend", createTrackHTML(i, playerLabel));
          players.push({ score: 0, combo: 0, notes: [] });
        }
        playerAccuracyStats = players.map(() => ({ spawned: 0, hit: 0, perfect: 0 }));
        bestCombo = 0;

        for (let pIdx = 0; pIdx < trackCount; pIdx++) {
          for (let kIdx = 0; kIdx < 4; kIdx++) {
            const fret = document.getElementById(`fret-${pIdx}-${kIdx}`);

            const startPress = (e) => {
              e.preventDefault();
              triggerHit(pIdx, kIdx);
            };
            const endPress = (e) => {
              e.preventDefault();
              if (activePointerFret?.pointerId === e.pointerId) {
                releaseHit(activePointerFret.player, activePointerFret.lane);
                activePointerFret = null;
              } else {
                releaseHit(pIdx, kIdx);
              }
            };

            fret.addEventListener("pointerdown", (e) => {
              startPress(e);
              if (e.pointerType !== "mouse") {
                activePointerFret = { pointerId: e.pointerId, player: pIdx, lane: kIdx };
                try { fret.setPointerCapture(e.pointerId); } catch (_) {}
              }
            });
            fret.addEventListener("pointerup", endPress);
            fret.addEventListener("pointercancel", endPress);
            fret.addEventListener("lostpointercapture", endPress);
          }
        }

        startSongMusic();

        lastFrameTime = performance.now();
        gameLoopId = requestAnimationFrame(updateEngine);
        clearInterval(songIntervalId);
        if (customSongAudio && customSongSelected) {
          customSongAudio.onplay = () => { songStartedAt = performance.now(); };
          customSongAudio.onended = finishGame;
          songIntervalId = setInterval(() => {
            if (customSongAudio && !customSongAudio.paused && !roundFinished) spawnBeatNote();
          }, Math.max(180, 60000 / Number(document.getElementById("custom-bpm").value || 120)));
        } else {
          songIntervalId = setInterval(spawnBeatNote, beatIntervalMs);
        }
      }

      function exitGame() {
        cancelAnimationFrame(gameLoopId);
        clearInterval(songIntervalId);
        stopSongMusic();
        if (roomPingTimer) clearInterval(roomPingTimer);
        roomPingTimer = null;
        if (customSongAudio) customSongAudio.pause();
        roundFinished = true;
        gamePaused = false;
        document.getElementById("game-container").classList.remove("is-paused");
        players = [];
        document.getElementById("result-modal").style.display = "none";
        document.getElementById("song-progress-fill").style.width = "0%";
        document.getElementById("song-elapsed").textContent = "0:00";

        if (unsubscribeRoom) unsubscribeRoom();

        document.getElementById("game-container").style.display = "none";
        document.getElementById("menu").style.display = "flex";
        if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(() => {});
      }

      async function enterGameFullscreen() {
        const container = document.getElementById("game-container");
        try {
          if (document.fullscreenElement) await document.exitFullscreen();
          else if (container.requestFullscreen) await container.requestFullscreen();
        } catch (_) {
          // Fullscreen may require an explicit browser gesture or be unsupported.
        }
      }

      document.getElementById("game-fullscreen").addEventListener("click", enterGameFullscreen);

      function toggleGamePause() {
        if (!players.length || roundFinished) return;
        gamePaused = !gamePaused;
        const container = document.getElementById("game-container");
        const pauseButton = document.getElementById("game-pause");
        if (gamePaused) {
          pauseStartedAt = performance.now();
          clearInterval(songIntervalId);
          clearInterval(songProgressTimer);
          clearTimeout(songNoteTimer);
          clearTimeout(songFinishTimer);
          if (customSongAudio) customSongAudio.pause();
          container.classList.add("is-paused");
          pauseButton.textContent = "LANJUT";
          pauseButton.setAttribute("aria-label", "Lanjutkan permainan");
          return;
        }
        const pausedFor = performance.now() - pauseStartedAt;
        songStartedAt += pausedFor;
        container.classList.remove("is-paused");
        pauseButton.textContent = "JEDA";
        pauseButton.setAttribute("aria-label", "Jeda permainan");
        if (customSongAudio && customSongSelected) customSongAudio.play().catch(() => {});
        else if (resumeSongPlayback) resumeSongPlayback();
        songProgressTimer = setInterval(() => {
          const elapsed = customSongAudio && customSongSelected
            ? customSongAudio.currentTime * 1000
            : Math.min(performance.now() - songStartedAt, songDurationMs);
          updateSongProgress(elapsed);
        }, 80);
        songIntervalId = setInterval(() => {
          if (customSongAudio && customSongSelected && !customSongAudio.paused && !roundFinished) spawnBeatNote();
          else if (!customSongSelected && !roundFinished) spawnBeatNote();
        }, customSongAudio && customSongSelected
          ? Math.max(180, 60000 / Number(document.getElementById("custom-bpm").value || 120))
          : beatIntervalMs);
      }
      document.getElementById("game-pause").addEventListener("click", toggleGamePause);
      document.getElementById("game-volume").addEventListener("input", (event) => {
        songVolume = Number(event.target.value);
        if (customSongAudio) customSongAudio.volume = songVolume;
      });

      // Prevent browser double-tap zoom only while the game is visible on touch devices.
      document.addEventListener("touchend", (event) => {
        if (!isMobileLayout() || document.getElementById("game-container").style.display !== "flex") return;
        const now = performance.now();
        if (now - lastMobileTapAt < 320) event.preventDefault();
        lastMobileTapAt = now;
      }, { passive: false });

      // Keep a held lane active as a finger slides between on-screen fret buttons.
      document.addEventListener("pointermove", (event) => {
        if (!activePointerFret || event.pointerId !== activePointerFret.pointerId) return;
        const target = document.elementFromPoint(event.clientX, event.clientY)?.closest(".fret-target");
        const match = target?.id.match(/^fret-(\d+)-(\d+)$/);
        if (!match) return;
        const player = Number(match[1]);
        const lane = Number(match[2]);
        if (player === activePointerFret.player && lane === activePointerFret.lane) return;
        releaseHit(activePointerFret.player, activePointerFret.lane);
        triggerHit(player, lane);
        activePointerFret = { ...activePointerFret, player, lane };
      }, { passive: true });

      function spawnBeatNote() {
        if (roundFinished) return;
        const keyIndex = Math.floor(Math.random() * 4);
        const isHold = Math.random() < 0.25;
        const holdLength = isHold ? Math.floor(Math.random() * 100) + 80 : 0;
        let spawned = false;

        players.forEach((p, pIdx) => {
          if (isOnline && !isMobileLayout() && pIdx !== playerRole) return;

          const board = document.getElementById(`board-${pIdx}`);
          const highway = board?.closest(".highway");
          if (!board || !highway) return;

          const noteEl = document.createElement("div");
          noteEl.className = "note";
          noteEl.setAttribute("data-key", keyIndex);
          const fret = document.getElementById(`fret-${pIdx}-${keyIndex}`);
          const highwayRect = highway.getBoundingClientRect();
          const fretRect = fret.getBoundingClientRect();
          noteEl.style.left = `${fretRect.left + fretRect.width / 2 - highwayRect.left}px`;
          noteEl.style.top = "-50px";

          if (isHold) {
            const tailEl = document.createElement("div");
            tailEl.className = "note-tail";
            tailEl.setAttribute("data-key", keyIndex);
            tailEl.style.height = holdLength + "px";
            tailEl.style.top = -holdLength + "px";
            noteEl.appendChild(tailEl);
          }

          highway.appendChild(noteEl);
          p.notes.push({
            el: noteEl,
            key: keyIndex,
            top: -50,
            isHold,
            holdLength,
            holding: false,
            hit: false,
          });
          if (playerAccuracyStats[pIdx]) playerAccuracyStats[pIdx].spawned++;
          spawned = true;
        });
        if (spawned) roundNotesSpawned++;
      }

      function updateEngine(now) {
        if (gamePaused) {
          gameLoopId = requestAnimationFrame(updateEngine);
          return;
        }
        const delta = Math.min(2.5, (now - lastFrameTime) / 16.66);
        lastFrameTime = now;

        players.forEach((p, pIdx) => {
          const board = document.getElementById(`board-${pIdx}`);
          const fret = document.getElementById(`fret-${pIdx}-0`);
          if (!board || !fret) return;
          const fretRect = fret.getBoundingClientRect();
          const highwayRect = board.closest(".highway").getBoundingClientRect();
          const targetY = fretRect.top + fretRect.height / 2 - highwayRect.top;
          for (let i = p.notes.length - 1; i >= 0; i--) {
            const n = p.notes[i];
            n.top += noteSpeed * delta;
            n.el.style.top = `${n.top}px`;

            if (n.holding) {
              n.holdLength -= noteSpeed * delta;
              p.score += 2;
              document.getElementById(`score-${pIdx}`).innerText = p.score;
              playSound(laneFreqs[n.key], 0.08);

              const tail = n.el.querySelector(".note-tail");
              if (tail) tail.style.height = Math.max(0, n.holdLength) + "px";

              if (n.holdLength <= 0) {
                showFeedback(pIdx, "PERFECT HOLD!", "var(--accent-green)");
                n.el.remove();
                p.notes.splice(i, 1);
                continue;
              }
            }

            const noteRect = n.el.getBoundingClientRect();
            const noteCenter = noteRect.top + noteRect.height / 2 - highwayRect.top;
            const fretRadius = fretRect.height / 2;
            // Miss only after the note's center has passed the full visible target circle.
            if (noteCenter > targetY + fretRadius + noteRect.height / 2 && !n.hit && !n.holding) {
              showFeedback(pIdx, "MISS!", "var(--accent-pink)");
              p.combo = 0;
              document.getElementById(`combo-${pIdx}`).innerText = p.combo;
              n.el.remove();
              p.notes.splice(i, 1);
            }
          }
        });

        gameLoopId = requestAnimationFrame(updateEngine);
      }

      function triggerHit(pIdx, keyIndex) {
        // Frets are silent; the soundtrack remains the only music source.
        activeHolds[`${pIdx}-${keyIndex}`] = true;

        const fret = document.getElementById(`fret-${pIdx}-${keyIndex}`);
        if (fret) {
          fret.classList.add("active");
          const rect = fret.getBoundingClientRect();
          const colors = ["#00ff66", "#ff0055", "#ffcc00", "#00f0ff"];
          triggerSparkEffect(
            rect.left + rect.width / 2,
            rect.top + rect.height / 2,
            colors[keyIndex],
          );
          if (navigator.vibrate && isMobileLayout()) navigator.vibrate(10);
        }

        const p = players[pIdx];
        if (!p) return;

        const fretRect = fret?.getBoundingClientRect();
        const targetY = (fretRect ? fretRect.top + fretRect.height / 2 : window.innerHeight - 120) + hitOffsetMs * (noteSpeed / 1000);
        let closestIdx = -1;
        let minDistance = Infinity;

        p.notes.forEach((n, idx) => {
          if (n.key === keyIndex && !n.hit && !n.holding) {
            const noteRect = n.el.getBoundingClientRect();
            const dist = Math.abs(noteRect.top + noteRect.height / 2 - targetY);
            if (dist < minDistance) {
              minDistance = dist;
              closestIdx = idx;
            }
          }
        });

        const timingWindow = 12;
        if (closestIdx !== -1 && minDistance <= timingWindow) {
          const note = p.notes[closestIdx];

          if (note.isHold) {
            note.holding = true;
            showFeedback(pIdx, "HOLD!", "var(--accent-yellow)");
          } else {
            note.hit = true;
            note.el.remove();
            p.notes.splice(closestIdx, 1);

            const accuracy = minDistance < 18 ? "PERFECT!" : minDistance < 34 ? "GREAT!" : minDistance < 52 ? "GOOD!" : "OK!";
            let points = minDistance < 18 ? 100 : minDistance < 34 ? 80 : minDistance < 52 ? 55 : 30;
            showFeedback(
              pIdx,
              accuracy,
              minDistance < 34 ? "var(--accent-green)" : "var(--accent-yellow)",
            );

            p.combo++;
            bestCombo = Math.max(bestCombo, p.combo);
            p.score += points + p.combo * 5;
            roundNotesHit++;
            if (minDistance < 18) roundNotesPerfect++;
            if (playerAccuracyStats[pIdx]) {
              playerAccuracyStats[pIdx].hit++;
              if (minDistance < 18) playerAccuracyStats[pIdx].perfect++;
            }
            document.getElementById(`score-${pIdx}`).innerText = p.score;
            document.getElementById(`combo-${pIdx}`).innerText = p.combo;
            const bestLabel = document.querySelector(`#track-${pIdx} .combo-best`);
            if (bestLabel) bestLabel.textContent = `BEST ${bestCombo}`;
            if (!isOnline) {
              const personalBest = Number(localStorage.getItem("musikManiaBestScore") || 0);
              if (p.score > personalBest) localStorage.setItem("musikManiaBestScore", String(p.score));
            }
          }

          if (isOnline && (isMobileLayout() ? pIdx === 0 : pIdx === playerRole)) {
            const roomRef = window.doc(window.db, "rooms", roomId);
            const updateData = {};
            updateData[`p${playerRole + 1}_score`] = p.score;
            window.updateDoc(roomRef, updateData);
          }
        }
      }

      function releaseHit(pIdx, keyIndex) {
        activeHolds[`${pIdx}-${keyIndex}`] = false;

        const fret = document.getElementById(`fret-${pIdx}-${keyIndex}`);
        if (fret) fret.classList.remove("active");

        const p = players[pIdx];
        if (!p) return;

        p.notes.forEach((n) => {
          if (n.key === keyIndex && n.holding) {
            n.holding = false;
            n.hit = true;
            showFeedback(pIdx, "DROPPED!", "var(--accent-pink)");
          }
        });
      }

      window.addEventListener("keydown", (e) => {
        if (gamePaused) return;
        keyMappings.forEach((map, pIdx) => {
          const keyIdx = map.keys.indexOf(e.key);
          if (keyIdx !== -1 && !activeHolds[`${pIdx}-${keyIdx}`]) {
            triggerHit(pIdx, keyIdx);
          }
        });
      });

      window.addEventListener("keyup", (e) => {
        keyMappings.forEach((map, pIdx) => {
          const keyIdx = map.keys.indexOf(e.key);
          if (keyIdx !== -1) {
            releaseHit(pIdx, keyIdx);
          }
        });
      });

      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("sw.js", { scope: "./" })
            .catch((err) => console.log(err));
        });
      }

      // Expose fungsi ke scope global HTML onclick
      window.startGame = startGame;
      window.restartGame = restartGame;
      window.generateRoomCode = generateRoomCode;
      window.joinOnlineRoom = joinOnlineRoom;
      window.toggleReadyStatus = toggleReadyStatus;
      window.leaveLobby = leaveLobby;
      window.exitGame = exitGame;
      window.toggleSettings = toggleSettings;
      window.loadCustomSong = loadCustomSong;
      window.selectBuiltInSong = selectBuiltInSong;
      const hitOffsetControl = document.getElementById("hit-offset");
      hitOffsetControl.value = String(hitOffsetMs);
      document.getElementById("hit-offset-value").textContent = `${hitOffsetMs} ms`;
      hitOffsetControl.addEventListener("input", () => {
        document.getElementById("hit-offset-value").textContent = `${hitOffsetControl.value} ms`;
      });

      window.addEventListener("fullscreenchange", () => {
        const button = document.getElementById("game-fullscreen");
        const fullscreen = Boolean(document.fullscreenElement);
        button.textContent = fullscreen ? "⛶" : "⛶";
        button.setAttribute("aria-label", fullscreen ? "Keluar layar penuh" : "Masuk layar penuh");
        button.title = fullscreen ? "Keluar layar penuh" : "Layar penuh";
      });
      hitOffsetControl.addEventListener("change", () => {
        hitOffsetMs = Number(hitOffsetControl.value) || 0;
        localStorage.setItem("musikManiaHitOffset", String(hitOffsetMs));
      });
    </script>
  </body>
</html>
